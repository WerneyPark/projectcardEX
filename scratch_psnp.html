    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const inputField = document.getElementById("psn_idpsnp");
            
            if (!inputField) return;

            const secretContainer = document.createElement("div");
            secretContainer.id = "sabbath-secret-area";
            secretContainer.style.display = "none";
            secretContainer.style.marginTop = "20px";
            secretContainer.style.textAlign = "center";
            secretContainer.style.animation = "fadeIn 1s";

            secretContainer.innerHTML = `
                <a href="sbv.html" target="_blank" style="
                    display: inline-block;
                    background: linear-gradient(90deg, #da4b9a, #3eb1e8);
                    color: white;
                    padding: 10px 25px;
                    text-decoration: none;
                    font-family: 'Rajdhani', sans-serif;
                    border-radius: 50px;
                    font-weight: bold;
                    font-size: 1rem;
                    box-shadow: 0 0 20px rgba(62, 177, 232, 0.4);
                    border: 1px solid #fff;
                    transition: transform 0.2s;
                " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                    👑 ACESSAR COLEÇÃO SABBAVERSE ➜
                </a>            
            `;

            inputField.parentNode.appendChild(secretContainer);

            inputField.addEventListener("keyup", function(e) {
                const textoDigitado = e.target.value.trim().toUpperCase();
                if (textoDigitado === "SABBATH1979") {
                    secretContainer.style.display = "block";
                } else {
                    secretContainer.style.display = "none";
                }
            });

            const style = document.createElement('style');
            style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }`;
            document.head.appendChild(style);
        });
    </script>
